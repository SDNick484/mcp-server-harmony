[build-system]
requires = ["setuptools>=77"]  # 77: SPDX `license` strings (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-harmony"
dynamic = ["version"]  # from harmony_mcp.__version__ (below)
description = "MCP server for the Logitech Harmony Hub (local websocket API), activity-first and allow-listed by the hub's own config"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicholas E. Andrade" }]
requires-python = ">=3.11"
keywords = ["mcp", "mcp-server", "harmony", "logitech-harmony", "harmony-hub", "home-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    "mcp>=2.3,<3",
    "aioharmony>=1.0.10,<2",
    "aiohttp>=3.9",          # already required by aioharmony; used directly by the fake hub and doctor
    "pyjwt[crypto]>=2.10",   # verifying Cloudflare Access assertions (remote.py)
    "uvicorn>=0.31",         # the HTTP transport (remote.py)
    "typing_extensions>=4.7",
]

[project.urls]
Homepage = "https://github.com/SDNick484/mcp-server-harmony"
Issues = "https://github.com/SDNick484/mcp-server-harmony/issues"
Changelog = "https://github.com/SDNick484/mcp-server-harmony/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6", "mypy>=1.11", "httpx2"]

[project.scripts]
mcp-server-harmony = "harmony_mcp.cli:main"

[tool.setuptools.dynamic]
version = { attr = "harmony_mcp.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"harmony_mcp.sim" = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # aioharmony's own aiohttp usage; nothing we can fix here.
    "ignore:enable_cleanup_closed ignored:DeprecationWarning",
    "ignore:verify_ssl is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["aioharmony.*"]  # ships no type hints (no py.typed)
ignore_missing_imports = true
