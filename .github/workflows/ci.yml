name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, for the shared-drift job's --latest check (below). A schedule runs the
  # whole workflow, so the other jobs also catch a dependency release that breaks us.
  schedule:
    - cron: "0 8 * * 1"  # Mondays 8:00
      timezone: America/Los_Angeles  # 8 a.m. Pacific all year, across daylight saving
  workflow_dispatch:  # a "Run workflow" button: also runs the --latest check

# The token gets nothing it doesn't need: these jobs only read the checkout.
permissions:
  contents: read

# One run per branch and event. A push to a PR branch cancels that PR's previous run; pushes to main
# and the weekly schedule queue instead, so a merge can't cancel the schedule's --latest check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to a commit, not a tag: a tag can be moved. The comment is the version the SHA
# was taken from; Dependabot (.github/dependabot.yml) bumps both together.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  # The built wheel, installed on its own and launched over stdio the way Claude Desktop launches it, on the
  # three systems people run Claude Desktop on. The test job runs from a source checkout on Linux only, so
  # this is the one place a packaging slip or a macOS/Windows difference would show before a release.
  # No hub is needed: with an empty config the status tool still answers (with a hint).
  wheel-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash  # Git Bash on Windows, so one script serves all three
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install build && python -m build --wheel
      - name: Install the wheel in a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/v"
          if [ -d "$RUNNER_TEMP/v/Scripts" ]; then bin="$RUNNER_TEMP/v/Scripts"; else bin="$RUNNER_TEMP/v/bin"; fi
          "$bin/python" -m pip install dist/*.whl
          echo "BIN=$bin" >>"$GITHUB_ENV"
      - name: First exchange over stdio, no hub configured
        env:
          HARMONY_CONFIG_DIR: ${{ runner.temp }}/empty-config
        run: |
          version=$(python -c 'import re, pathlib; print(re.search(r"__version__ = \"(.+)\"", pathlib.Path("src/harmony_mcp/__init__.py").read_text())[1])')
          python scripts/smoke_stdio.py --expect-version "$version" --call harmony_get_status -- "$BIN/mcp-server-harmony"

  alpine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD:/src" -w /src python:3.12-alpine sh deploy/alpine/smoke-test.sh

  # The files shared with the sibling servers (shared.lock, scripts/sync_shared.py) must
  # match mcp-server-shared, the source of truth. On pushes and PRs: at the locked commit,
  # so a copy edited here fails, and a PR is never judged on changes made elsewhere. On the
  # schedule (or a manual run): also against mcp-server-shared main, so falling behind fails.
  # The job itself lives in mcp-server-shared (.github/workflows/shared-drift.yml): it runs this
  # repo's own scripts/sync_shared.py, so the check is the one this repo's lock pins.
  shared-drift:
    uses: SDNick484/mcp-server-shared/.github/workflows/shared-drift.yml@5f9b824fb1ab1f5e8db1196980125355d5293a5a # v0.1.1
